<html>
<head>
    <title>Page de victoire</title>
    <link rel="stylesheet" href="style.css">
</head>
    <body>
        <p id="message_victoire">Calcul des scores</p>

        <script>
            // Si l'URL est gagnant.html?vainqueur=Alice
            const params = new URLSearchParams(window.location.search);
            const nomGagnant = params.get('vainqueur');

            if (nomGagnant) {
                document.body.style.backgroundColor = "#d4af37"; 
                document.getElementById('message_victoire').innerText = 
                    "Félicitations à " + nomGagnant + " ! ";
            }
        </script>

        <form action="Serv_Bac" method="get">
        <button type="submit">Rejouer</button>
        <input type="hidden" name="op" value="redemarrer_partie">
        </form>

    </body>
</html>

<html>
<head>
    <title>Formulaire de réponse</title>
    <link rel="stylesheet" href="style.css">
</head>
    <body>
        <form action="Serv_Bac" method="get">
        
        <label for="Pays">Pays : </label>
        <input type="text" id="Pays" name="Pays"><br>

        <label for="Ville">Ville : </label>
        <input type="text" id="Ville" name="Ville"><br>

        <label for="Prenom">Prénom : </label>
        <input type="text" id="Prenom" name="Prenom"><br>

        <label for="Couleur">Couleur: </label>
        <input type="text" id="Couleur" name="Couleur"><br>

        <label for="Fruit">Fruit : </label>
        <input type="text" id="Fruit" name="Fruit"><br>

        <label for="Animal">Animal : </label>
        <input type="text" id="Animal" name="Animal"><br>

        <label for="Metier">Métier : </label>
        <input type="text" id="Metier" name="Metier"><br>

        <button type="submit">FINI !!!!</button>
        <input type="hidden" name="op" value="Enregistrer_reponse">
        </form>

        <script>
            const socket = new WebSocket('ws://votre-serveur-adresse/Serv_Bac');

            socket.onmessage = function(event) {
                const data = JSON.parse(event.data);
                if (data.status === "FINI") {
                    stopperLaPartie();
                    envoyerReponses();
                }
            };

            function stopperLaPartie() {
                const inputs = document.querySelectorAll('input');
                for (let input of inputs) {
                    input.readOnly = true; 
                    input.style.backgroundColor = "#e0e0e0";
                }
                alert("STOP ! La partie est terminée !");
                document.querySelector('button').style.display = 'none';
            }

            function envoyerReponses() {
                const formulaire = document.querySelector('form');
                formulaire.submit(); 
            }

            document.querySelector('form').addEventListener('submit', function(e) {
                e.preventDefault(); 
                socket.send(JSON.stringify({ action: "STOP" }));
                console.log("Signal STOP envoyé !");
            });
        </script>
    </body>
</html>

<html>
<head><title>Lobby</title></head>
    <body>
        <form action="Serv_Bac" method="get">
        
            <p>Paramètre de la partie:</p>
            <div>
            <input type="range" id="temps" name="temps" min="0" max="5" list="temps_list"> 
                <datalist id="temps_list">
                <option value="0"></option>
                <option value="1"></option>
                <option value="2"></option>
                <option value="3"></option>
                <option value="4"></option>
                <option value="5"></option>
                </datalist>
            <label for="temps">Temps : <span id="valeur_temps">2</span> min</label>
            </div>

            <div>
            <input type="range" id="nb_tours" name="nb_tours" min="0" max="6" list="nb_tours_list" />
                <datalist id="nb_tours_list">
                <option value="0"></option>
                <option value="1"></option>
                <option value="2"></option>
                <option value="3"></option>
                <option value="4"></option>
                <option value="5"></option>
                <option value="6"></option>
                </datalist>
            <label for="nb_tours">Nombre de tours</label>
            </div>

            <h3>Joueurs connectés :</h3>
            <ul id="liste_joueurs">
                <li>En attente de joueurs...</li>
            </ul>
        
        <button type="submit">Lancer la partie</button>
        <input type="hidden" name="op" value="demarrer_partie">
        </form>

        <script>
            const socket = new WebSocket('ws://votre-serveur-adresse/Serv_Bac');

            socket.onmessage = function(event) {
                const data = JSON.parse(event.data);

                if (data.status === "UPDATE_PLAYERS") {
                    const ul = document.getElementById('liste_joueurs');
                    ul.innerHTML = "";
                    
                    data.joueurs.forEach(surnom => {
                        const li = document.createElement('li');
                        li.textContent = surnom;
                        ul.appendChild(li);
                    });
                }

                if (data.status === "START") {
                    window.location.href = "Serv_Bac?op=afficher_jeu"; 
                }
            };
            
            const inputTemps = document.getElementById('temps');
            inputTemps.addEventListener('input', () => {
                document.getElementById('valeur_temps').innerText = inputTemps.value;
            });

            document.querySelector('form').addEventListener('submit', function(e) {
                e.preventDefault(); 
                
                const temps = document.getElementById('temps').value;
                const tours = document.getElementById('nb_tours').value;

                socket.send(JSON.stringify({ 
                    action: "LANCER_PARTIE",
                    temps: temps,
                    tours: tours
                }));
                console.log("Demande de lancement envoyée au serveur...");
            });
        </script>
    </body>
</html>
